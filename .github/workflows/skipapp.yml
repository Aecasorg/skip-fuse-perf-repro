name: skip-fuse-perf-repro
on:
  push:
    branches: ['*']
    tags: "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Skip's own reference CI for app projects: builds the Swift (Darwin) and
  # Gradle (Android) projects. Local-tests disabled — this repo exists to verify
  # the Android build + produce an APK for on-device counter verification.
  call-workflow:
    uses: skiptools/actions/.github/workflows/skip-app.yml@v1
    with:
      run-local-tests: false
